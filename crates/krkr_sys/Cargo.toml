[package]
name        = "krkr_sys"
version     = "0.1.0"
edition     = "2021"
license     = "GPL-2.0-or-later"
description = "Raw FFI bindings for Kirikiroid2, generated at build time"
links       = "kirikiroid2"
build       = "build.rs"

[dependencies]
krkr_shim = { path = "../krkr_shim" }

[build-dependencies]
krkr_codegen = { path = "../../codegen" }
bindgen      = { version = "0.72", optional = true }
cc           = { version = "1", optional = true, features = ["parallel"] }
pkg-config   = { version = "0.3", optional = true }

[features]
default  = []
real_ffi = ["dep:bindgen", "dep:cc", "dep:pkg-config"]
plugin-xp3filter = []
