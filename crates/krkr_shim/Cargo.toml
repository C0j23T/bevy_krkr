[package]
name        = "krkr_shim"
version     = "0.1.0"
edition     = "2024"
license     = "GPL-2.0-or-later"
description = "C ABI replacements for the small system libraries the Kirikiroid2 core links against"
publish     = false

[lib]
name = "krkr_shim"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
lz4_flex = { version = "0.11" }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }
image-webp = "0.2"
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
png = "0.18"
miniz_oxide = "0.8"
quick-xml = "0.41"

[dev-dependencies]
png = "0.18"
