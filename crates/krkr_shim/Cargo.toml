[package]
name        = "krkr_shim"
version     = "0.1.0"
edition     = "2024"
license     = "GPL-2.0-or-later"
description = "C ABI replacements for the small system libraries the Kirikiroid2 core links against"
publish     = false

[lib]
name = "krkr_shim"

[dependencies]
ttf-parser = "0.25"
fontdb = "0.23"
harfrust = "0.12"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-script = "0.5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
krkr_storage = { path = "../krkr_storage" }
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
lz4_flex = { version = "0.11" }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "ico"] }
gif = "0.14"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
image-webp = "0.2"
libwebp-sys = "0.14.4"
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
png = "0.18"
miniz_oxide = "0.8"
quick-xml = "0.41"

[dev-dependencies]
png = "0.18"
