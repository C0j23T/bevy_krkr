[package]
name        = "krkr_plugin"
version     = "0.1.0"
edition     = "2024"
license     = "GPL-2.0-or-later"
description = "Top-level Bevy plugin assembling the bevy_krkr subsystems"

[dependencies]
krkr_sys    = { path = "../krkr_sys" }
krkr_script = { path = "../krkr_script" }
cpal        = "0.18"
bevy        = { workspace = true }
krkr_shim = { path = "../krkr_shim" }
bytemuck = { version = "1", features = ["derive"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"], optional = true }

ffmpeg-sys-next = { version = "9", default-features = false, optional = true }
indoc = "2.0.8"
itertools = "0.15.0"

[features]
video-ffmpeg = ["dep:ffmpeg-next"]
video-bundled = ["video-ffmpeg", "dep:ffmpeg-sys-next", "ffmpeg-sys-next/build-videotoolbox", "ffmpeg-sys-next/build-mediacodec", "ffmpeg-sys-next/build-lib-d3d11va", "ffmpeg-sys-next/build-vaapi", "ffmpeg-sys-next/build-portable"]
