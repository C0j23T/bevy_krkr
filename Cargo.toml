[workspace]
members = [
    ".",
    "crates/krkr_sys",
    "crates/krkr_shim",
    "crates/krkr_script",
    "crates/krkr_plugin",
    "codegen",
]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "jpeg"] }
thiserror = "2"

# ──────────────────────────────────────────────────────────────────────────────
[package]
name    = "bevy_krkr"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Bevy integration layer for Kirikiri2 / KAG3 (via Kirikiroid2 FFI)"
repository  = "https://github.com/your-org/bevy_krkr"
keywords    = ["bevy", "visual-novel", "kirikiri", "kag"]
categories  = ["game-engines"]

[lib]
name = "bevy_krkr"

# ──────────────────────────────────────────────────────────────────────────────
# Runtime dependencies
[dependencies]
krkr_plugin = { path = "crates/krkr_plugin" }
krkr_script = { path = "crates/krkr_script" }
krkr_sys    = { path = "crates/krkr_sys" }

bevy = { workspace = true }

[dev-dependencies]
bevy-inspector-egui = { git = "https://github.com/jakobhellermann/bevy-inspector-egui.git" }

[features]
default  = ["real_ffi", "xp3filter"]
real_ffi = ["krkr_sys/real_ffi"]
xp3filter = ["krkr_sys/plugin-xp3filter"]

[[example]]
name = "snbk"
path = "examples/snbk.rs"
